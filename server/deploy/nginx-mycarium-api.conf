# API and MQTT proxy locations — add to the existing mycarium.morphatic.com
# server block in /etc/nginx/sites-available/mycarium, above the static file
# location block.

# Security headers — add these inside the server { } block, before locations
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://mycarium.morphatic.com; img-src 'self' data:; font-src 'self';" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# MQTT WebSocket proxy — terminates the browser WSS connection and forwards
# to Mosquitto's WSS listener (port 8083) using the app-proxy client cert
# for mTLS authentication.
location /mqtt {
    proxy_pass https://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # mTLS: present the app-proxy cert to Mosquitto
    proxy_ssl_certificate     /etc/mosquitto/certs/mycarium.morphatic.com/app-proxy.crt;
    proxy_ssl_certificate_key /etc/mosquitto/certs/mycarium.morphatic.com/app-proxy.key;
    proxy_ssl_trusted_certificate /etc/mosquitto/certs/mycarium.morphatic.com/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_name mycarium.morphatic.com;
    proxy_ssl_server_name on;

    # Long-lived WebSocket connections
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location /health {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /auth/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /devices {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
